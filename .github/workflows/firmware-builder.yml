name: Firmware Builder

on:
  workflow_call:
    inputs:
      firmware_type:
        required: true
        type: string
      release_title_prefix:
        required: true
        type: string
      # Set by a manual run: the release version, used instead of the tag's.
      version:
        required: false
        type: string
        default: ''

jobs:

  # Publishing a draft prepared by a manual run creates its tag, and the tag push
  # starts this workflow again. That release already carries its images, so
  # nothing is built twice: a tag whose release exists is skipped.
  guard:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Check For An Existing Release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]] && gh release view "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} exists: not building it again"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  generate-build-matrix:
    needs: guard
    if: needs.guard.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.get-build-targets.outputs.targets }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Get Build Targets
        id: get-build-targets
        run: |
          # get list of firmwares to build
          TARGET_LIST=$(/usr/bin/env bash build.sh get-${{ inputs.firmware_type }}-firmwares-to-build)
          
          # convert targets separated by new line into a json array string
          JSON_ARRAY=$(echo "$TARGET_LIST" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          
          # use json array as targets result
          echo "targets=$JSON_ARRAY" >> $GITHUB_OUTPUT

  build:
    needs: generate-build-matrix
    runs-on: ubuntu-latest
    continue-on-error: true # don't fail entire build if one board fails to build
    strategy:
      matrix:
        target: ${{ fromJson(needs.generate-build-matrix.outputs.targets) }}
      fail-fast: false # don't cancel other builds if one board fails to build
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      # Every target may need the ESP32 power-saving core (tools/ps_framework.py);
      # the install script is idempotent.
      - name: Cache ESP32 PS Core
        uses: actions/cache@v5
        with:
          path: ~/.platformio/ps
          key: ${{ runner.os }}-ps-core-${{ hashFiles('tools/ps_framework.py') }}

      - name: Install ESP32 PS Core
        run: python tools/ps_framework.py

      - name: Build Firmware
        env:
          FIRMWARE_VERSION: ${{ inputs.version != '' && inputs.version || env.GIT_TAG_VERSION }}
        run: /usr/bin/env bash build.sh build-firmware ${{ matrix.target }}

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.target }}"
          path: out

  create-release:
    needs: build
    runs-on: ubuntu-latest
    # tagged builds, and manual runs given a version
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ inputs.release_title_prefix }} ${{ inputs.version != '' && inputs.version || env.GIT_TAG_VERSION }}"
          # A manual run names the tag the draft will create when it is published.
          tag_name: ${{ inputs.version != '' && format('{0}-{1}', inputs.firmware_type, inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body: ""
          draft: true
          files: out/*
