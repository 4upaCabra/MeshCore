name: Build Companion Firmwares

permissions:
  contents: write

on:
  # A manual run with a version builds the release images and prepares a draft
  # release with them; GitHub creates the tag when the draft is published, so the
  # images are built once. Without a version it is a test build only.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v1.17.1b3 (empty: test build, no release)'
        required: false
        default: ''
  push:
    tags:
      - 'companion-*'

jobs:
  build-companion-firmwares:
    uses: ./.github/workflows/firmware-builder.yml
    with:
      firmware_type: 'companion'
      release_title_prefix: 'Companion Firmware'
      version: ${{ inputs.version }}
